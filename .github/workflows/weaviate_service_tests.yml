name: Weaviate Service Tests

on:
  push:

jobs:
  weaviate_service_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements_test.txt

      - name: Check required tokens
        id: token_check
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          PERSONAL_TOKEN2: ${{ secrets.PERSONAL_TOKEN2 }}
          PERSONAL_TOKEN3: ${{ secrets.PERSONAL_TOKEN3 }}
        run: |
          missing=0
          for token_name in PERSONAL_TOKEN PERSONAL_TOKEN2 PERSONAL_TOKEN3; do
            if [ -z "${!token_name}" ]; then
              echo "Missing secret: $token_name"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run weaviate_service test suite
        if: steps.token_check.outputs.run_tests == 'true'
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          PERSONAL_TOKEN2: ${{ secrets.PERSONAL_TOKEN2 }}
          PERSONAL_TOKEN3: ${{ secrets.PERSONAL_TOKEN3 }}
          HYPHA_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          WEAVIATE_TEST_ENABLE_EMBEDDING: "true"
        run: |
          pytest tests/weaviate_service -v

      - name: Skip summary
        if: steps.token_check.outputs.run_tests != 'true'
        run: |
          echo "Skipping weaviate_service tests because required secrets are missing."
