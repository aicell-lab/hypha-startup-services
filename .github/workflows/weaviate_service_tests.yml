name: Weaviate Service Tests

on:
  push:

jobs:
  weaviate_service_tests_no_embedding:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements_test.txt

      - name: Validate CI test environment
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          PERSONAL_TOKEN2: ${{ secrets.PERSONAL_TOKEN2 }}
          PERSONAL_TOKEN3: ${{ secrets.PERSONAL_TOKEN3 }}
          USER1_WS: ${{ vars.USER1_WS }}
          USER2_WS: ${{ vars.USER2_WS }}
          USER3_WS: ${{ vars.USER3_WS }}
          WEAVIATE_TEST_NAMESPACE: noembed-${{ github.run_id }}-${{ github.run_attempt }}
          WEAVIATE_TEST_ENABLE_EMBEDDING: "false"
        run: |
          python scripts/validate_weaviate_ci_env.py

      - name: Run weaviate_service test suite
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          PERSONAL_TOKEN2: ${{ secrets.PERSONAL_TOKEN2 }}
          PERSONAL_TOKEN3: ${{ secrets.PERSONAL_TOKEN3 }}
          USER1_WS: ${{ vars.USER1_WS }}
          USER2_WS: ${{ vars.USER2_WS }}
          USER3_WS: ${{ vars.USER3_WS }}
          HYPHA_TOKEN: ${{ secrets.HYPHA_AGENTS_TOKEN }}
          HYPHA_AGENTS_TOKEN: ${{ secrets.HYPHA_AGENTS_TOKEN }}
          WEAVIATE_TEST_NAMESPACE: noembed-${{ github.run_id }}-${{ github.run_attempt }}
          WEAVIATE_TEST_ENABLE_EMBEDDING: "false"
        run: |
          pytest tests/weaviate_service -v

  weaviate_service_tests_embedding_guarded:
    needs: weaviate_service_tests_no_embedding
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements_test.txt

      - name: Validate CI embedding test environment
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          PERSONAL_TOKEN2: ${{ secrets.PERSONAL_TOKEN2 }}
          PERSONAL_TOKEN3: ${{ secrets.PERSONAL_TOKEN3 }}
          USER1_WS: ${{ vars.USER1_WS }}
          USER2_WS: ${{ vars.USER2_WS }}
          USER3_WS: ${{ vars.USER3_WS }}
          WEAVIATE_TEST_NAMESPACE: embed-${{ github.run_id }}-${{ github.run_attempt }}
          WEAVIATE_TEST_ENABLE_EMBEDDING: "true"
        run: |
          python scripts/validate_weaviate_ci_env.py

      - name: Run guarded embedding test suite
        id: guarded_embedding_tests
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          PERSONAL_TOKEN2: ${{ secrets.PERSONAL_TOKEN2 }}
          PERSONAL_TOKEN3: ${{ secrets.PERSONAL_TOKEN3 }}
          USER1_WS: ${{ vars.USER1_WS }}
          USER2_WS: ${{ vars.USER2_WS }}
          USER3_WS: ${{ vars.USER3_WS }}
          HYPHA_TOKEN: ${{ secrets.HYPHA_AGENTS_TOKEN }}
          HYPHA_AGENTS_TOKEN: ${{ secrets.HYPHA_AGENTS_TOKEN }}
          WEAVIATE_TEST_NAMESPACE: embed-${{ github.run_id }}-${{ github.run_attempt }}
          WEAVIATE_TEST_ENABLE_EMBEDDING: "true"
        run: |
          set +e
          python scripts/run_weaviate_embedding_tests_guarded.py \
            --tests-path tests/weaviate_service
          exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 42 ]; then
            echo "::warning::Embedding tests hit GPU OOM/capacity limits. Treating as warning-only for this run."
            exit 0
          fi
          exit "$exit_code"

      - name: Summarize guarded embedding outcome
        if: always()
        run: |
          if [ "${{ steps.guarded_embedding_tests.outputs.exit_code }}" = "42" ]; then
            echo "### Guarded embedding tests: warning-only OOM/capacity result" >> "$GITHUB_STEP_SUMMARY"
            echo "Detected GPU memory/capacity constraints. Merge can proceed; investigate capacity separately." >> "$GITHUB_STEP_SUMMARY"
          fi
