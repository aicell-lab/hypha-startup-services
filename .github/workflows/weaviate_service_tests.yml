name: Weaviate Service Tests

on:
  push:

jobs:
  weaviate_service_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements_test.txt

      - name: Check required tokens
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          PERSONAL_TOKEN2: ${{ secrets.PERSONAL_TOKEN2 }}
          PERSONAL_TOKEN3: ${{ secrets.PERSONAL_TOKEN3 }}
          USER1_WS: ${{ vars.USER1_WS }}
          USER2_WS: ${{ vars.USER2_WS }}
          USER3_WS: ${{ vars.USER3_WS }}
        run: |
          missing=0
          for required_name in \
            PERSONAL_TOKEN \
            PERSONAL_TOKEN2 \
            PERSONAL_TOKEN3 \
            USER1_WS \
            USER2_WS \
            USER3_WS; do
            if [ -z "${!required_name}" ]; then
              echo "Missing required CI value: $required_name"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "Required secrets/variables are missing. Failing workflow."
            exit 1
          fi

      - name: Run weaviate_service test suite
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          PERSONAL_TOKEN2: ${{ secrets.PERSONAL_TOKEN2 }}
          PERSONAL_TOKEN3: ${{ secrets.PERSONAL_TOKEN3 }}
          USER1_WS: ${{ vars.USER1_WS }}
          USER2_WS: ${{ vars.USER2_WS }}
          USER3_WS: ${{ vars.USER3_WS }}
          HYPHA_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          WEAVIATE_TEST_ENABLE_EMBEDDING: "true"
        run: |
          pytest tests/weaviate_service -v
