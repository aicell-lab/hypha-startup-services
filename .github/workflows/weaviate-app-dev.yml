name: Weaviate App CI (Dev)

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    env:
      HYPHA_SERVER_URL: ${{ vars.HYPHA_SERVER_URL }}
      HYPHA_WORKSPACE: ${{ vars.HYPHA_WORKSPACE || 'hypha-agents' }}
      HYPHA_TOKEN: ${{ secrets.HYPHA_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install hypha-rpc python-dotenv pyyaml
          # Determine if we want to use hypha-apps-cli for management
          # git clone --depth 1 https://github.com/oeway/hypha-apps-cli ../hypha-apps-cli
          # python -m pip install -r ../hypha-apps-cli/requirements.txt
          chmod +x scripts/*.py

      - name: Calculate App ID
        id: app_id
        run: |
          # Use python script to ensure consistent slugification
          # Assumes scripts/app_utils.py exists and works
          BRANCH_SLUG=$(python3 -c "from scripts.app_utils import get_branch_slug; import os; print(get_branch_slug('${{ github.ref_name }}'))")
          echo "app_id=weaviate-dev-$BRANCH_SLUG" >> $GITHUB_OUTPUT

      - name: Deploy Dev App
        run: |
          # Using custom script instead of CLI for now to handle specific env logic if needed
          python3 scripts/deploy_weaviate_app.py \
            --server-url "$HYPHA_SERVER_URL" \
            --token "$HYPHA_TOKEN" \
            --app-id "${{ steps.app_id.outputs.app_id }}" \
            --source "weaviate-app/app_dev.py" \
            --manifest "weaviate-app/manifest.yaml" \
            --non-fatal-start

      - name: Health Check
        run: |
          # Wait a bit for startup
          sleep 10
          python3 scripts/test_weaviate_app.py \
            --server-url "$HYPHA_SERVER_URL" \
            --token "$HYPHA_TOKEN" \
            --app-id "${{ steps.app_id.outputs.app_id }}" \
            --service-id "${{ steps.app_id.outputs.app_id }}" \
            --service-id "weaviate-dev"

      - name: Notify Slack on Failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' --data '{"text":"🚨 *Deployment Failed* for Weaviate App (Dev)!\nRepository: '"$GITHUB_REPOSITORY"'\nRef: '"$GITHUB_REF"'\n<'"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"'|View Run>"}' "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL not set, skipping notification."
          fi
